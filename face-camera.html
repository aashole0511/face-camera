<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>สแกนใบหน้า - ระบบร้านซ่อม</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e7eb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(100%,560px);background:#111c31;border:1px solid #334155;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0006}h1{font-size:22px;margin:0 0 8px}p{color:#cbd5e1;line-height:1.55}.video-wrap{background:#020617;border-radius:16px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.status{padding:12px;border-radius:12px;background:#1e293b;margin:12px 0;line-height:1.5}.status.error{background:#7f1d1d}.status.good{background:#14532d}.row{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer}.primary{background:#38bdf8;color:#082f49}.secondary{background:#334155;color:#f8fafc}button:disabled{opacity:.45;cursor:not-allowed}.small{font-size:12px;color:#94a3b8;margin-top:14px}
</style><script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script></head>
<body><main class="card"><h1 id="heading">🔐 เตรียมระบบสแกนใบหน้า</h1><p>อนุญาตให้เว็บนี้ใช้กล้องเมื่อเบราว์เซอร์ถาม จากนั้นจัดใบหน้าให้อยู่กลางภาพและมองกล้องโดยตรง</p><div class="video-wrap"><video id="video" autoplay muted playsinline></video></div><div id="status" class="status">กำลังเชื่อมต่อกับระบบร้านค้า…</div><div class="row"><button id="start" class="primary" disabled>กำลังเตรียมระบบ…</button><button id="switch" class="secondary" disabled>🔄 สลับกล้อง</button><button id="close" class="secondary">ปิดหน้าต่าง</button></div><div class="small">ข้อมูลใบหน้าจะถูกส่งกลับไปยังแท็บระบบร้านค้าที่เปิดหน้านี้เท่านั้น หน้านี้ไม่บันทึกข้อมูลใบหน้าไว้ใน URL</div></main>
<script>
const statusEl=document.getElementById('status'),video=document.getElementById('video'),startBtn=document.getElementById('start'),switchBtn=document.getElementById('switch');
let stream=null,ready=false,mode='',busy=false,deviceId='';
let parentOrigin='';try{parentOrigin=new URL(document.referrer).origin}catch(e){}
function say(t,type=''){statusEl.textContent=t;statusEl.className='status'+(type?' '+type:'')}
function send(o){if(window.opener&&!window.opener.closed&&parentOrigin)window.opener.postMessage(o,parentOrigin)}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}try{video.pause();video.srcObject=null}catch(e){}}
async function openCam(id=''){
 stop();let last;
 const tries=[];if(id)tries.push({video:{deviceId:{exact:id}},audio:false});tries.push({video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false});tries.push({video:true,audio:false});
 for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){last=e;if(['NotAllowedError','SecurityError','PermissionDeniedError'].includes(e.name))throw Error('กล้องถูกปฏิเสธสิทธิ์ กรุณากดไอคอนแม่กุญแจของ URL นี้ ตั้งค่า Camera เป็น Allow แล้วรีโหลดหน้านี้')}}
 if(!stream)throw last||Error('เปิดกล้องไม่สำเร็จ');video.srcObject=stream;await video.play();deviceId=stream.getVideoTracks()[0]?.getSettings?.().deviceId||'';switchBtn.disabled=false;
}
async function loadModels(){if(!window.faceapi)throw Error('โหลด face-api.js ไม่สำเร็จ ตรวจอินเทอร์เน็ตหรือการบล็อก CDN');const b='https://justadudewhohacks.github.io/face-api.js/models';await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(b),faceapi.nets.faceLandmark68Net.loadFromUri(b),faceapi.nets.faceRecognitionNet.loadFromUri(b)])}
async function descriptor(){const d=await faceapi.detectSingleFace(video,new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.55})).withFaceLandmarks().withFaceDescriptor();if(!d)throw Error('ไม่พบใบหน้า กรุณาอยู่ตรงกลางภาพและเพิ่มแสงสว่าง');return Array.from(d.descriptor)}
async function begin(m){mode=m;document.getElementById('heading').textContent=m==='enroll'?'🧑‍💻 ลงทะเบียนใบหน้า':m==='in'?'🕘 ยืนยันใบหน้าเพื่อเข้างาน':'🕔 ยืนยันใบหน้าเพื่อออกงาน';say('กำลังขอใช้กล้อง…');try{await openCam();say('เปิดกล้องแล้ว กำลังโหลดระบบตรวจใบหน้า…');await loadModels();ready=true;startBtn.disabled=false;startBtn.textContent=m==='enroll'?'ลงทะเบียนใบหน้า':'เริ่มตรวจสอบใบหน้า';say('พร้อมแล้ว กดปุ่มเพื่อเริ่มตรวจสอบ','good')}catch(e){say(e.message||'เตรียมกล้องไม่สำเร็จ','error');startBtn.disabled=true}}
window.addEventListener('message',e=>{if(!window.opener||e.source!==window.opener||!parentOrigin||e.origin!==parentOrigin)return;const m=e.data||{};if(m.type==='FACE_CAMERA_START_V8812')begin(m.mode);if(m.type==='FACE_CAMERA_RESULT_V8812'){busy=false;startBtn.disabled=false;say(m.message||'ดำเนินการเสร็จสิ้น',m.ok?'good':'error');startBtn.textContent=m.ok?'เสร็จสิ้น':'ลองอีกครั้ง';if(m.ok){setTimeout(()=>{stop();if(window.opener&&!window.opener.closed)window.close()},1200)}}});
switchBtn.addEventListener('click',async()=>{try{const ds=(await navigator.mediaDevices.enumerateDevices()).filter(x=>x.kind==='videoinput');if(ds.length<2){say('พบกล้อง '+ds.length+' ตัว ไม่มีกล้องอื่นให้สลับ');return}const i=ds.findIndex(x=>x.deviceId===deviceId);await openCam(ds[(i+1)%ds.length].deviceId);say('เปลี่ยนกล้องแล้ว','good')}catch(e){say(e.message,'error')}});
startBtn.addEventListener('click',async()=>{if(!ready||busy)return;busy=true;startBtn.disabled=true;say('กำลังตรวจใบหน้า กรุณาอย่าขยับ…');try{const ds=[];for(let i=0;i<3;i++){await new Promise(r=>setTimeout(r,450));ds.push(await descriptor())}const avg=ds[0].map((_,i)=>ds.reduce((a,d)=>a+d[i],0)/ds.length);say('ส่งผลตรวจกลับไปยังระบบร้านค้า…');send({type:'FACE_CAMERA_DESCRIPTOR_V8812',descriptor:avg})}catch(e){busy=false;startBtn.disabled=false;say(e.message||'ตรวจใบหน้าไม่สำเร็จ','error')}});
document.getElementById('close').addEventListener('click',()=>{stop();window.close()});window.addEventListener('beforeunload',stop);
if(!window.opener||!parentOrigin){say('กรุณาเปิดหน้านี้จากปุ่มลงทะเบียน/เข้างาน/ออกงาน ภายในระบบร้านค้า','error')}else{send({type:'FACE_CAMERA_READY_V8812'});say('เชื่อมต่อแล้ว กำลังรอคำสั่งจากระบบร้านค้า…')}
</script></body></html>
